# Produção, só a partir de main e só depois do gate.
#
# O produto é uma URL de imagem que vive dentro do README de outra pessoa,
# servida com `s-maxage=86400`. Um deploy quebrado não é uma página que o
# visitante recarrega — é arte errada, em cache, no repositório de terceiro. Por
# isso o deploy espera os testes em vez de correr ao lado deles.
name: production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

# Ver o comentário equivalente em preview.yml: token por env, não por `--token=`.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      public_url: ${{ steps.deploy.outputs.public_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache do build do Next
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Conferir as credenciais da Vercel
        run: |
          faltando=""
          [ -n "$VERCEL_TOKEN" ]      || faltando="$faltando VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || faltando="$faltando VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || faltando="$faltando VERCEL_PROJECT_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Secret ausente ou vazio:$faltando — grave em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar a CLI da Vercel
        run: npm i -g vercel@latest

      - name: Puxar o ambiente de Production
        run: vercel pull --yes --environment=production

      # Os dois pesam diferente, e o passo trata cada um como o código trata.
      #
      # `GITHUB_TOKEN` é fatal: sem ele **toda** carta vira carta de erro, e o
      # deploy sobe verde servindo um produto que não funciona.
      #
      # `REDIS_URL` é aviso. A tentação é exigir, já que a RFC 11 o chama de
      # obrigatório em produção, mas o código discorda por escrito: sem Redis a
      # carta sai sem número de série, e `.env.example` argumenta que carta sem
      # número é honesta enquanto carta com número errado, já embutida no README
      # de alguém, não é. Degradar assim é a decisão de projeto — bloquear o
      # deploy aqui seria endurecê-la por conta própria.
      - name: Conferir o ambiente de Production
        run: |
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::$env_file não existe — o vercel pull não escreveu o ambiente."
            exit 1
          fi

          if ! grep -q '^GITHUB_TOKEN=..' "$env_file"; then
            echo "::error::GITHUB_TOKEN não está definido no ambiente Production da Vercel. Toda carta serviria a carta de erro. Grave em Project Settings > Environment Variables."
            exit 1
          fi

          if ! grep -q '^REDIS_URL=..' "$env_file"; then
            echo "::warning::REDIS_URL não está definido em Production: as cartas vão sair sem número de série e o cache da API cai para o fallback por processo (RFC 11, .env.example)."
          fi

      - name: Build
        run: vercel build --prod

      # Duas URLs saem daqui, e o smoke precisa da segunda.
      #
      # `url` é o que o deploy imprime: a URL única daquele deployment
      # (`gitmon-cards-<hash>-<escopo>.vercel.app`). Ela serve para o link do
      # environment do GitHub, mas **está atrás da Deployment Protection** — a
      # Standard Protection isenta o domínio de produção, não a URL de
      # deployment. O smoke apontado para ela recebia o 302 para
      # `vercel.com/sso-api` e falhava acusando as rotas de imagem.
      #
      # `public_url` é o alias estável de produção, tirado de
      # NEXT_PUBLIC_BASE_URL, que é o mesmo endereço que vai dentro do README de
      # terceiro. Testar produção em qualquer outro endereço é testar um lugar
      # onde ninguém vai olhar.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Avisa e cai para a URL de deployment em vez de derrubar o deploy: o
          # produto já subiu quando esta linha roda, e perder o deploy por causa
          # do endereço que o *teste* usa seria trocar um problema pequeno por um
          # grande. Sem o alias o smoke falha como falhava antes, com a diferença
          # de que agora o log diz por quê.
          public_url=$(grep -m1 '^NEXT_PUBLIC_BASE_URL=' .vercel/.env.production.local 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$public_url" ]; then
            echo "::warning::NEXT_PUBLIC_BASE_URL não veio no vercel pull; o smoke vai usar a URL de deployment, que está atrás da Deployment Protection e responde 302 para vercel.com/sso-api. Para corrigir, grave o endereço público como variável do repositório e leia-a aqui."
            public_url="$url"
          fi
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"

  # Recorte deliberado: só o que está marcado `@smoke` em tests/e2e/smoke.spec.ts.
  #
  # São os casos que provam que produção está de fato ligada — PNG com o
  # Cache-Control da RFC 4.2, carta de repo, prévia em 1200x630, carta de erro
  # com max-age curto e o recorte de /assets/ no rewrite. Os demais ficam de
  # fora porque os testes de batalha gravariam registros reais no Redis de
  # produção, com TTL de 30 dias, a cada push em main.
  #
  # Era `-g "rotas de imagem"`, que casava pelo título do describe: renomear o
  # describe desligava este smoke sem que nada apontasse para cá. A tag é
  # declarada no teste, do lado de quem decide se ele escreve ou não.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # O alias público, não a URL de deployment. Ver o comentário no passo de
      # deploy. Sem bypass, de propósito: se o endereço que as pessoas embutem
      # no README precisar de secret para responder, o produto está quebrado e é
      # isto que tem que falhar.
      - name: Smoke das rotas de imagem
        run: npm run test:e2e -- --grep @smoke
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.public_url }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 14
